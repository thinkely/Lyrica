name: Generate Release Summary

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  release-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: release
        run: |
          # Build release notes from recent commits
          if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            COMMITS=$(git log --oneline ${{ github.event.before }}..${{ github.sha }})
          else
            COMMITS=$(git log --oneline -5)
          fi
          echo "## Edge Release - Commit ${{ github.sha }}" > /tmp/notes.md
          echo "" >> /tmp/notes.md
          echo "### Recent Changes" >> /tmp/notes.md
          echo "" >> /tmp/notes.md
          echo "$COMMITS" >> /tmp/notes.md
          echo "" >> /tmp/notes.md
          echo "---" >> /tmp/notes.md
          echo "_This is an automated edge release._" >> /tmp/notes.md
          echo "notes_file=/tmp/notes.md" >> $GITHUB_OUTPUT

      - name: Create or update edge release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view edge --json tagName 2>/dev/null; then
            gh release update edge \
              --title "Edge Release - ${{ github.sha }}" \
              --notes-file /tmp/notes.md \
              --prerelease
          else
            gh release create edge \
              --title "Edge Release - ${{ github.sha }}" \
              --notes-file /tmp/notes.md \
              --prerelease
          fi
